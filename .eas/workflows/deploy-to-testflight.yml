# Push to main: production build (only if native code changed) ->
# App Store Connect / TestFlight + an over-the-air update.
name: Deploy to TestFlight (iOS)

on:
  push:
    branches: ['main']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production
  get_ios_build:
    name: Check for existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production
  submit_ios_build:
    name: Submit to TestFlight
    needs: [build_ios]
    # Only new builds: App Store Connect rejects a build number twice.
    if: ${{ needs.build_ios.outputs.build_id }}
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_ios.outputs.build_id }}
  publish_ios_update:
    name: Publish iOS update
    needs: [get_ios_build, build_ios]
    if: ${{ needs.get_ios_build.outputs.build_id || needs.build_ios.outputs.build_id }}
    type: update
    params:
      channel: production
      platform: ios
