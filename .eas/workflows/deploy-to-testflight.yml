# Push to main: always a new production build (the build number goes up
# automatically) -> App Store Connect / TestFlight, plus an over-the-air
# update so users on an existing build with the same native code get the
# changes too. New users get everything inside the build on the first open.
name: Deploy to TestFlight (iOS)

on:
  push:
    branches: ['main']

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
  submit_ios_build:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_ios.outputs.build_id }}
  publish_ios_update:
    name: Publish iOS update
    needs: [build_ios]
    type: update
    params:
      channel: production
      platform: ios
